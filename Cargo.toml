[package]
name = "katecraft"
version = "0.1.0"
edition = "2021"
description = "KateCraft — a text and code editor (Rust + egui)"

[dependencies]
eframe = { version = "0.37", default-features = false, features = ["glow", "wayland", "x11", "default_fonts"] }
egui = "0.37"
image = { version = "0.25", default-features = false, features = ["png"] }

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
